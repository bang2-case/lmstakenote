name: Sync LMS Data

on:
  workflow_dispatch:

concurrency:
  group: sync-lms-data
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch LMS data and upload Supabase cache
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONIOENCODING: utf-8
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LMS_TOKEN: ${{ secrets.LMS_TOKEN }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      LMS_LOGIN_EMAIL: ${{ secrets.LMS_LOGIN_EMAIL }}
      LMS_LOGIN_PASSWORD: ${{ secrets.LMS_LOGIN_PASSWORD }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      USE_SUPABASE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          python - <<'PY'
          import os
          import sys

          has_database = bool(os.getenv("DATABASE_URL"))
          has_token = bool(os.getenv("LMS_TOKEN"))
          has_login = all(os.getenv(name) for name in ("FIREBASE_API_KEY", "LMS_LOGIN_EMAIL", "LMS_LOGIN_PASSWORD"))
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")

          missing = []
          if not has_database:
              missing.append("DATABASE_URL")
          if not has_token and not has_login:
              missing.append("LMS_TOKEN or FIREBASE_API_KEY + LMS_LOGIN_EMAIL + LMS_LOGIN_PASSWORD")

          if missing:
              lines = ["## Missing GitHub Actions secrets", ""]
              print("Missing required GitHub Actions secrets:")
              for item in missing:
                  print(f"- {item}")
                  print(f"::error title=Missing secret::{item}")
                  lines.append(f"- `{item}`")
              lines.extend([
                  "",
                  "Add them in `GitHub repo -> Settings -> Secrets and variables -> Actions`.",
                  "Vercel Environment Variables are separate and are not visible to GitHub Actions.",
              ])
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")
              sys.exit(1)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("## Secret check passed\n\n")
                  f.write("- `DATABASE_URL`: configured\n")
                  f.write("- LMS auth: configured\n")
          PY

      - name: Fetch data from LMS
        run: python main.py

      - name: Upload cache to Supabase
        run: python scripts/sync_supabase_cache.py
