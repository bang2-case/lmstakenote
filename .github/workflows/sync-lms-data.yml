name: Sync LMS Data

on:
  workflow_dispatch:

concurrency:
  group: sync-lms-data
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch LMS data and upload Supabase cache
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONIOENCODING: utf-8
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LMS_TOKEN: ${{ secrets.LMS_TOKEN }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      LMS_LOGIN_EMAIL: ${{ secrets.LMS_LOGIN_EMAIL }}
      LMS_LOGIN_PASSWORD: ${{ secrets.LMS_LOGIN_PASSWORD }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      USE_SUPABASE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          python - <<'PY'
          import os
          import sys

          has_database = bool(os.getenv("DATABASE_URL"))
          has_token = bool(os.getenv("LMS_TOKEN"))
          has_login = all(os.getenv(name) for name in ("FIREBASE_API_KEY", "LMS_LOGIN_EMAIL", "LMS_LOGIN_PASSWORD"))
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")

          missing = []
          if not has_database:
              missing.append("DATABASE_URL")
          if not has_token and not has_login:
              missing.append("LMS_TOKEN or FIREBASE_API_KEY + LMS_LOGIN_EMAIL + LMS_LOGIN_PASSWORD")

          if missing:
              lines = ["## Missing GitHub Actions secrets", ""]
              print("Missing required GitHub Actions secrets:")
              for item in missing:
                  print(f"- {item}")
                  print(f"::error title=Missing secret::{item}")
                  lines.append(f"- `{item}`")
              lines.extend([
                  "",
                  "Add them in `GitHub repo -> Settings -> Secrets and variables -> Actions`.",
                  "Vercel Environment Variables are separate and are not visible to GitHub Actions.",
              ])
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")
              sys.exit(1)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("## Secret check passed\n\n")
                  f.write("- `DATABASE_URL`: configured\n")
                  f.write("- LMS auth: configured\n")
          PY

      - name: Resolve fresh LMS token from login credentials
        if: ${{ env.FIREBASE_API_KEY != '' && env.LMS_LOGIN_EMAIL != '' && env.LMS_LOGIN_PASSWORD != '' }}
        run: |
          echo "Fetching a fresh LMS token from login credentials..."
          TOKEN="$(node get-idtoken.js | tail -n 1)"
          if [ -z "$TOKEN" ]; then
            echo "::error title=Token refresh failed::get-idtoken.js returned an empty token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "LMS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Validate LMS token expiry
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          token = (os.getenv("LMS_TOKEN") or "").strip()
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")

          def write_summary(lines):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")

          if not token:
              print("::error title=Missing LMS_TOKEN::LMS_TOKEN is empty after secret validation/token refresh.")
              write_summary([
                  "## LMS token check failed",
                  "",
                  "`LMS_TOKEN` is empty after validation. Add `LMS_TOKEN`, or add all login secrets so the workflow can generate one.",
              ])
              sys.exit(1)

          try:
              parts = token.split(".")
              if len(parts) != 3:
                  raise ValueError("token is not a JWT")
              payload = parts[1] + "=" * (-len(parts[1]) % 4)
              data = json.loads(base64.urlsafe_b64decode(payload.encode("utf-8")))
              remaining = int(data.get("exp", 0) - time.time())
          except Exception as exc:
              print(f"Could not decode LMS_TOKEN expiry, continuing and letting LMS validate it: {exc}")
              write_summary(["## LMS token check", "", "Could not decode token expiry, continuing."])
              sys.exit(0)

          if remaining <= 0:
              print("::error title=Expired LMS_TOKEN::The LMS_TOKEN GitHub secret is expired.")
              write_summary([
                  "## LMS token check failed",
                  "",
                  "`LMS_TOKEN` is expired.",
                  "Update the `LMS_TOKEN` repository secret, or add `FIREBASE_API_KEY`, `LMS_LOGIN_EMAIL`, and `LMS_LOGIN_PASSWORD` so the workflow can generate a fresh token.",
              ])
              sys.exit(2)

          minutes = remaining // 60
          print(f"LMS_TOKEN is valid for about {minutes} minutes.")
          write_summary(["## LMS token check passed", "", f"- Remaining: about `{minutes}` minutes"])
          PY

      - name: Fetch data from LMS
        run: |
          set -o pipefail
          if ! python main.py 2>&1 | tee main.log; then
            {
              echo "## Fetch data from LMS failed"
              echo
              echo '```text'
              tail -n 80 main.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload cache to Supabase
        run: |
          set -o pipefail
          if ! python scripts/sync_supabase_cache.py 2>&1 | tee sync_supabase_cache.log; then
            {
              echo "## Upload cache to Supabase failed"
              echo
              echo '```text'
              tail -n 80 sync_supabase_cache.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
